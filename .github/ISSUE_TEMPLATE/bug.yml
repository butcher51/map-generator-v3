name: Bug
description: Something behaves incorrectly.
labels: ['bug']
body:
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the site with ?seed=coast
        2. Click Random
        3. The legend counts do not change
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: 'index.html, dashboard, or a specific module'
  - type: markdown
    attributes:
      value: 'Add the **agent:ready** label when this is ready to be picked up.'
